name: Temporary native UI accessibility probe
on:
  push:
    branches: ['validation-native/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Install browser automation client
        run: python -m pip install -r tests/browser/requirements.txt
      - name: Download the verified release installer
        shell: pwsh
        run: |
          gh release download v0.1.0 --repo CalmBuilder/Super-SAG --pattern 'Super-SAG_0.1.0_x64-setup.exe' --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/Super-SAG_0.1.0_x64-setup.exe").Hash
          if ($digest -ne 'F6B96076EA23BFC9C537C3D3B2B245A5D296EABDFC243FF588ED816BB2A7A644') { throw 'The downloaded installer does not match the accepted Windows baseline.' }
          Write-Output "Accepted installer SHA-256: $digest"
      - name: Install in isolation
        id: install
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Installer "$env:RUNNER_TEMP/Super-SAG_0.1.0_x64-setup.exe" -Version '0.1.0'
      - name: Exercise the installed Windows WebView
        shell: pwsh
        env:
          SMOKE_DIRECTORY: ${{ steps.install.outputs.directory }}
        run: |
          ./tests/bs/native_ui_windows.ps1 -InstallDirectory "$env:SMOKE_DIRECTORY/installation"
          python tests/bs/windows_visual_compare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-accepted-baseline
          path: ${{ runner.temp }}/bs-native-ui-evidence/
          if-no-files-found: warn
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download the previously built test DMG
        run: |
          gh release download v0.1.0 --repo CalmBuilder/Super-SAG --pattern 'Super-SAG-0.1.0-macOS-arm64.zip' --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/Super-SAG-0.1.0-macOS-arm64.zip" -d "$RUNNER_TEMP/mac-artifact"
          mkdir -p src-tauri/target/release/bundle/dmg
          cp "$RUNNER_TEMP"/mac-artifact/*.dmg src-tauri/target/release/bundle/dmg/
      - name: Build and inspect accessibility tree
        run: |
          swiftc tests/bs/native_probe_macos.swift -o "$RUNNER_TEMP/native-ax-probe"
          python3 scripts/smoke-macos.py --arch arm64
