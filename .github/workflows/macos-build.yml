name: Super-SAG macOS native build check

on:
  push:
    branches: [main, 'validation-macos/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-sag-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
      - run: npm ci
      - run: npm run check
      - run: npx vitest run tests/branding-assets.test.ts
      - run: cargo test --locked --manifest-path protocol/Cargo.toml
      - run: cargo test --locked --manifest-path core/Cargo.toml --test folder_index_options
      - name: Build actual app and DMG and inspect app contents
        run: npm run package:macos
      - name: Install the DMG into an isolated directory and start the app
        run: python3 scripts/smoke-macos.py --arch '${{ matrix.arch }}' --exercise-ui
      - name: Exercise the packaged CLI guide with real local files
        run: python3 tests/cli-guide-e2e.py --binary 'src-tauri/target/release/bundle/macos/Super-SAG.app/Contents/Resources/bin/sag'
