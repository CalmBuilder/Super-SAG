name: Super-SAG Windows build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-sag-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check
      - run: cargo test --locked --manifest-path protocol/Cargo.toml
      - run: cargo test --locked --manifest-path cli/Cargo.toml --test commands
      - run: npm run package:windows
      - name: Record installer digest without publishing it
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target -Filter 'Super-SAG*setup.exe' -File -Recurse)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName
