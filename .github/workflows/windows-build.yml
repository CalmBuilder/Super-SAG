name: Super-SAG Windows build check

on:
  push:
    branches: [main, 'validation/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-sag-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check
      - run: npx vitest run tests/branding-assets.test.ts
      - run: cargo test --locked --manifest-path protocol/Cargo.toml
      - run: cargo test --locked --manifest-path core/Cargo.toml --test folder_index_options
      - run: cargo test --locked --manifest-path cli/Cargo.toml --test commands
      - run: cargo test --locked --manifest-path cli/Cargo.toml --test index_commands
      - run: cargo test --locked --manifest-path cli/Cargo.toml --bin sag install::export_tests
      - name: Exercise CLI guide using the Windows debug build
        shell: pwsh
        run: |
          python tests/cli-guide-e2e.py --binary "src-tauri/target/debug/sag.exe" --windows-hosted-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test clipper paths on Windows
        shell: pwsh
        run: |
          $testBinary = Join-Path $env:RUNNER_TEMP 'super-sag-clipper-tests.exe'
          rustc --edition=2021 --test src-tauri/src/clipper_paths.rs -o $testBinary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testBinary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run package:windows
      - name: Record installer digest without publishing it
        id: installed-package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target -Filter 'Super-SAG*setup.exe' -File -Recurse)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & ./scripts/smoke-windows.ps1 -Installer $installers[0].FullName -Version $version
      - name: Exercise CLI guide using the installed package
        shell: pwsh
        env:
          PACKAGED_CLI: ${{ steps.installed-package.outputs.cli }}
        run: |
          python tests/cli-guide-e2e.py --binary "$env:PACKAGED_CLI" --windows-hosted-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise installer upgrade safeguards
        shell: pwsh
        env:
          SMOKE_DIRECTORY: ${{ steps.installed-package.outputs.directory }}
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target -Filter 'Super-SAG*setup.exe' -File -Recurse)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          & ./scripts/test-windows-installer-upgrade.ps1 -Installer $installers[0].FullName -SmokeDirectory "$env:SMOKE_DIRECTORY"
