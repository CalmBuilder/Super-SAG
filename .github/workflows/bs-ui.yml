name: Super-SAG browser workspace checks

on:
  push:
    branches: [main, 'validation/**', 'validation-browser/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-edge:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build:web:ui
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python tests/bs/browser_ui.py --browser chrome
      - run: python tests/bs/browser_ui.py --browser msedge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bs-ui-chrome-edge
          path: .cache/bs-ui/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  safari:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python3 -m pip install 'selenium==4.38.0'
      - name: Enable Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Exercise actual Safari
        run: python3 tests/bs/safari_ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bs-ui-safari
          path: .cache/bs-ui/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
